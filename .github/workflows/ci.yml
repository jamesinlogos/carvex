name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --locked 2>&1 | tee tests.log
      - name: Test failure detail
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          tail -n 10 tests.log \
            | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' \
            | cut -c1-200 \
            | while IFS= read -r line; do echo "::error::$line"; done
      - name: Documentation
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Release build
        run: cargo build --release --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  security:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: python3 bench/run_benchmark.py --smoke

  coverage:
    name: coverage (≥70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage floor (ratchet 70, next 75)
        run: scripts/coverage.sh 70
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: bench/results/coverage/lcov.info

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [jpeg, png, pdf, fat32_boot, ntfs_boot, ntfs_mft, partition_table,
           fuzz_e01, fuzz_vhd, fuzz_vmdk, fuzz_split_names, fuzz_open_image,
           fuzz_fragment_join]
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz smoke (60 s on push/PR, 10 min nightly)
        working-directory: fuzz
        # The repository pins 1.100.0 in rust-toolchain.toml.  An explicit
        # +nightly is required because cargo-fuzz passes -Z flags to rustc.
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  release-gate:
    name: release gate (G0-G9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run scripts/gate.sh
        id: gate
        run: |
          set -o pipefail
          bash scripts/gate.sh 2>&1 | tee gate.log
      - name: Gate failure detail
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          tail -n 10 gate.log \
            | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' \
            | cut -c1-200 \
            | while IFS= read -r line; do echo "::error::$line"; done

  review-repro:
    name: review repro assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Generate smoke fixture
        # The large bench/images/*.img fixtures are git-ignored.  Use the same
        # no-root FAT32 fixture as the gate smoke test; R7/R8 still SKIP
        # without an NTFS image, but the FAT32-dependent controls can run.
        run: python3 scripts/make_smoke_image.py --out target/repro-ci/fixture
      - name: Run X01-X24 controls
        id: repro
        run: |
          mkdir -p target/repro-ci
          set -o pipefail
          python3 scripts/review_repro.py --carvex target/release/carvex \
            --corpus bench/corpus --workdir target/repro-ci \
            --assert --xfail scripts/repro_xfail.txt \
            --fat32-image target/repro-ci/fixture/smoke_fat32.img 2>&1 | tee repro.log
      - name: Repro failure detail
        if: failure() && steps.repro.outcome == 'failure'
        run: |
          tail -n 10 repro.log \
            | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' \
            | cut -c1-200 \
            | while IFS= read -r line; do echo "::error::$line"; done

  musl-smoke:
    name: Linux musl packaged binary smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl Rust target
        # rust-toolchain.toml pins 1.100.0, so the action's stable target is not
        # the toolchain that builds the binary. Add the target explicitly.
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build musl release binary
        id: musl_build
        run: |
          set -o pipefail
          cargo build --release --locked --target x86_64-unknown-linux-musl 2>&1 | tee musl-build.log
      - name: Musl build failure detail
        if: failure() && steps.musl_build.outcome == 'failure'
        run: |
          tail -n 10 musl-build.log \
            | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' \
            | cut -c1-200 \
            | while IFS= read -r line; do echo "::error::$line"; done
      - name: Generate smoke fixture
        # bench/images/*.img are git-ignored and absent on a clean checkout.
        run: python3 scripts/make_smoke_image.py --out target/ci-smoke
      - name: Execute musl binary
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/carvex
          IMG=target/ci-smoke/smoke_fat32.img
          "$BIN" --version
          "$BIN" info "$IMG"
          rm -rf target/musl-scan && mkdir -p target/musl-scan
          "$BIN" scan "$IMG" -o target/musl-scan \
            --mode raw --no-fs --types jpeg --max-candidates 500 --quiet \
            --json-report target/musl-scan/report.json
          test -f target/musl-scan/report.json

  windows-packaged:
    name: Windows packaged binary smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Generate smoke fixture
        # bench/images/*.img are git-ignored and absent on a clean checkout.
        run: python scripts/make_smoke_image.py --out target\ci-smoke
      - name: Execute the release exe
        shell: pwsh
        run: |
          .\target\release\carvex.exe --version
          .\target\release\carvex.exe info target\ci-smoke\smoke_fat32.img
          if (Test-Path target\windows-scan) { Remove-Item -Recurse -Force target\windows-scan }
          New-Item -ItemType Directory -Path target\windows-scan | Out-Null
          .\target\release\carvex.exe scan target\ci-smoke\smoke_fat32.img -o target\windows-scan `
            --mode raw --no-fs --types jpeg --max-candidates 500 --quiet `
            --json-report target\windows-scan\report.json
          if (-not (Test-Path target\windows-scan\report.json)) {
            throw "no report written by packaged Windows binary"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: carvex-windows-ci
          path: target/release/carvex.exe

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/sbom.py --out bench/results/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bench/results/sbom.spdx.json

  status-labels:
    name: status labels (H-31)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile PROGRESS and REVIEW_RESPONSE
        run: python3 scripts/check_status.py
